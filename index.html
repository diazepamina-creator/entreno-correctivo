<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="description" content="Registro del trabajo correctivo con kettlebells: mantenimiento P3, bloque correctivo y complejo bilateral.">
<title>Correctivo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede6; --ink:#151515; --ink-2:#55534e; --ink-3:#77756f;
  --line:#dedbd2; --brand:#1F3A5F; --brand-ink:#ffffff; --accent:#2E6B4F; --accent-soft:#e3efe8;
  --amber:#7a4f00; --amber-bg:#fff2d9; --danger:#a8241c; --danger-bg:#fbe5e3;
  --series-1:#2a78d6; --series-2:#eb6834;
  --radius:16px; --gap:14px;
  --k-p3:#2E6B4F; --k-extras:#6a4c9c; --k-a:#1F3A5F; --k-b:#b5541c; --k-cierre:#6b6a64; --k-sleep:#3f5f8a; --k-air:#0f7d8c; --k-cocina:#5b7a1f;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 14px rgba(20,20,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --bg:#121416; --surface:#1b1e21; --surface-2:#252a2e; --ink:#f2f1ec; --ink-2:#bdbbb2; --ink-3:#9a988f;
    --line:#343a3f; --brand:#9cbde3; --brand-ink:#0e1a28; --accent:#6cc79a; --accent-soft:#1d3329;
    --amber:#f2c66e; --amber-bg:#3a2d12; --danger:#ff8a80; --danger-bg:#3d1c1a;
    --series-1:#3987e5; --series-2:#d95926;
    --k-p3:#6cc79a; --k-extras:#b49ae3; --k-a:#9cbde3; --k-b:#f0a070; --k-cierre:#bdbbb2; --k-sleep:#9ab6dd; --k-air:#5fc9d6; --k-cocina:#a9cf6a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121416; --surface:#1b1e21; --surface-2:#252a2e; --ink:#f2f1ec; --ink-2:#bdbbb2; --ink-3:#9a988f;
  --line:#343a3f; --brand:#9cbde3; --brand-ink:#0e1a28; --accent:#6cc79a; --accent-soft:#1d3329;
  --amber:#f2c66e; --amber-bg:#3a2d12; --danger:#ff8a80; --danger-bg:#3d1c1a;
  --series-1:#3987e5; --series-2:#d95926;
  --k-p3:#6cc79a; --k-extras:#b49ae3; --k-a:#9cbde3; --k-b:#f0a070; --k-cierre:#bdbbb2; --k-sleep:#9ab6dd; --k-air:#5fc9d6; --k-cocina:#a9cf6a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px}
.top-row{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}
.top-title{font-weight:750;font-size:17px;flex:1;min-width:0;letter-spacing:-.01em}
.top-title small{display:block;font-weight:500;font-size:13px;color:var(--ink-2)}
.icon-btn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.icon-btn:disabled{opacity:.35}
main{max-width:640px;margin:0 auto;padding:12px 16px 24px}
.panel{display:none}.panel.on{display:block}
.card{--k:var(--line);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 var(--gap);overflow:hidden;box-shadow:var(--shadow);position:relative}
.card[class*="k-"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.card.k-air{--k:var(--k-air)}.card.k-p3{--k:var(--k-p3)}.card.k-extras{--k:var(--k-extras)}.card.k-a{--k:var(--k-a)}.card.k-b{--k:var(--k-b)}.card.k-cierre{--k:var(--k-cierre)}.card.k-sleep{--k:var(--k-sleep)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 20px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.card-b{padding:0 16px 16px 20px}
.card-h .ico{flex:0 0 34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent)}
.card-h h2{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
.dayhead{margin:4px 0 14px}
.hero{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:var(--gap)}
.hero .ring{flex:0 0 76px;position:relative}
.hero .ring svg{display:block;width:76px;height:76px;transform:rotate(-90deg)}
.hero .ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-variant-numeric:tabular-nums}
.hero .txt{flex:1;min-width:0}
.hero h1{margin:6px 0 2px;font-size:20px;letter-spacing:-.015em;line-height:1.2}
.hero .hint{margin-top:2px}
.daystrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 var(--gap)}
.daystrip button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:650;color:var(--ink-2);min-height:56px}
.daystrip .bar{width:70%;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.daystrip .bar i{display:block;height:100%;background:var(--k);border-radius:3px}
.daystrip button.done{color:var(--ink);border-color:color-mix(in srgb,var(--k) 45%,var(--line))}
.daystrip .s-b{--k:var(--k-b)}.daystrip .s-p3{--k:var(--k-p3)}.daystrip .s-extras{--k:var(--k-extras)}.daystrip .s-a{--k:var(--k-a)}.daystrip .s-b{--k:var(--k-b)}.daystrip .s-cierre{--k:var(--k-cierre)}
.daystrip button.off{opacity:.45}
.card-h .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.chev{transition:transform .2s;color:var(--ink-3)}
.card.closed .card-b{display:none}.card.closed .chev{transform:rotate(-90deg)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--amber-bg);color:var(--amber)}
.daychip{display:inline-block;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--brand);color:var(--brand-ink)}
.daychip.rest{background:var(--surface-2);color:var(--ink)}
.daychip.opt{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:14px;color:var(--ink-2);margin:6px 0 0}
.note{border-left:4px solid var(--amber);background:var(--amber-bg);color:var(--amber);padding:10px 12px;border-radius:8px;font-size:14px;margin:10px 0}
.note.ok{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note.bad{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.ex-t{font-weight:650;display:flex;gap:8px;align-items:flex-start;flex-wrap:nowrap}
.ex-t .n{flex:0 0 24px;height:24px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;margin-top:-1px}
.ex-p{font-size:14px;color:var(--ink-2);margin:4px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ex-p.full{display:block;-webkit-line-clamp:unset}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field>label{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em}
.metric>label{color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2)}
.stepper button{min-width:46px;min-height:44px;border:0;background:none;font-size:22px;cursor:pointer}
.stepper button:active{background:var(--line)}
.stepper output{min-width:44px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.metric .stepper{border-color:var(--accent)}
.stepper output.empty,.timer-val.empty{color:var(--ink-3);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.card[class*="k-"] .chip[aria-pressed="true"]{background:var(--k);border-color:var(--k);color:var(--surface)}
.chip:active,.btn:active,.check:active .box{transform:scale(.97)}
.chip.sm{min-height:36px;padding:6px 12px;font-size:14px}
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:none;text-align:left;cursor:pointer;padding:6px 0}
.box{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--ink-3);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.check[aria-pressed="true"] .box{background:var(--k,var(--accent));border-color:var(--k,var(--accent));color:var(--surface)}
.card:not([class*="k-"]) .check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.check .lbl{flex:1;font-weight:600}.check .lbl small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);font-size:13px;font-weight:400;margin-top:1px}
.check .lbl small.full{display:block;-webkit-line-clamp:unset}
.check .lbl small.clamped::after{content:""}
.p3-item{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:6px 0}
.p3-item:first-child{border-top:0}
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.timer-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);font-weight:650;cursor:pointer}
.timer-val{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:52px}
.round{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--surface-2)}
.round-h{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:8px}
.round-h .r{flex:1}
input.num{width:100px;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface-2);color:var(--ink);font:inherit;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2);color:var(--ink);font:inherit;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:var(--gap)}
.wkhead{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.wkhead h2{flex:1;margin:0;font-size:18px;letter-spacing:-.01em}
.wkhead h2 small{display:block;font-size:13px;font-weight:500;color:var(--ink-2)}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wkday{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-height:118px}
.wkday.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.wkday.future{opacity:.45}
.wkday .dl{font-size:12px;font-weight:700;color:var(--ink-2)}
.wkday .dn{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums}
.wkday .ic{display:flex;flex-direction:column;gap:4px;align-items:center}
.wkday .ic i{width:22px;height:6px;border-radius:3px;background:var(--surface-2)}
.wkday .ic i.on{background:var(--k)}
.wkday .ic .p{--k:var(--k-p3)}.wkday .ic .t{--k:var(--k-a)}.wkday .ic .w{--k:var(--k-cierre)}.wkday .ic .a{--k:var(--k-air)}
.wkday .sl{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.wkday .sl.bien{background:var(--accent)}.wkday .sl.regular{background:#d6a330}.wkday .sl.mal{background:var(--danger)}
.wklegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.wklegend span{display:inline-flex;align-items:center;gap:6px}
.wklegend i{width:16px;height:6px;border-radius:3px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:var(--gap)}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.02em}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.kpi small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.kpi.good b{color:var(--accent)}.kpi.warn b{color:var(--amber)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.hist-item{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 0;cursor:pointer;min-height:52px}
.hist-item:first-child{border-top:0}
.hist-item .d{flex:0 0 96px;font-weight:650}
.hist-item .c{display:flex;flex-wrap:wrap;gap:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12);display:none;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2);margin:4px 0 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.t th,table.t td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t th{color:var(--ink-2);font-weight:600}
.link{background:none;border:0;color:var(--accent);font-weight:650;cursor:pointer;padding:6px 0;min-height:44px;text-align:left}
.guide h3{font-size:15px;margin:14px 0 6px}
.guide p,.guide li{font-size:15px}
.guide ul{padding-left:20px;margin:6px 0}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sched button{min-height:58px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.sched button small{font-weight:600;font-size:11px;color:var(--ink-2)}
.sched button.t{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.sched button.t small{color:var(--brand-ink)}
.sched button.o{background:var(--accent-soft);border-color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;min-height:62px;border:0;background:none;cursor:pointer;font-size:11.5px;font-weight:650;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
nav.tabs button[aria-current="page"] svg{background:color-mix(in srgb,var(--brand) 14%,transparent);border-radius:10px;padding:2px 8px;width:40px;box-sizing:content-box}
nav.tabs button svg{padding:2px 8px;width:40px;box-sizing:content-box}
.timer{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.timer.on{display:flex}
.t-label{font-size:18px;font-weight:650;max-width:420px}
.t-phase{font-size:14px;color:var(--ink-2);margin-top:6px;min-height:20px}
.t-big{font-size:min(28vw,150px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin:18px 0 8px}
.t-big.lead{color:var(--amber)}
.t-big.hit{color:var(--accent)}
.t-marks{font-size:14px;color:var(--ink-2)}
.t-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;margin-top:28px}
.t-btns .btn{min-height:64px;font-size:19px}
.card.k-desp,.card.k-menu,.card.k-tanda,.card.k-pesc,.card.k-compra{--k:var(--k-cocina)}
.pill.bad{background:var(--danger-bg);color:var(--danger)}
.ck-cat{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-2);margin:16px 0 2px}
.dsp{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:6px 0;cursor:pointer;font-weight:600;font-size:15px}
.dsp .st{margin-left:auto}
.dsp.hidden-item{opacity:.45}
.ck-cat + .dsp{border-top:0}
.msday{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.msday:first-child{border-top:0}
.msday .dl{grid-row:span 2;font-weight:750;font-size:14px;text-align:center;line-height:1.15}
.msday .dl small{display:block;font-weight:500;font-size:12px;color:var(--ink-2)}
.msday.today .dl{color:var(--k-cocina)}
.mslot{display:flex;align-items:center;gap:8px;min-width:0}
.mslot span{flex:0 0 46px;font-size:12px;font-weight:600;color:var(--ink-3)}
.sel{flex:1;min-width:0;width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:14.5px}
.txt{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:6px 10px;background:var(--surface-2);color:var(--ink);font:inherit}
.pz{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pz:first-of-type{border-top:0}
.pz .nm{font-weight:650}.pz .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-2)}
.pz .tot{font-variant-numeric:tabular-nums;font-weight:750;min-width:44px;text-align:right}
.mini-step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mini-step button{min-width:36px;min-height:36px;border:0;background:var(--surface-2);cursor:pointer;font-weight:700}
.mini-step output{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;display:none;max-width:90vw}
.toast.on{display:block}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <button class="icon-btn" data-action="day-prev" aria-label="Día anterior">‹</button>
    <div class="top-title" id="topTitle">Correctivo</div>
    <button class="icon-btn" data-action="day-today" id="btnToday" aria-label="Ir a hoy">Hoy</button>
    <button class="icon-btn" data-action="day-next" id="btnNext" aria-label="Día siguiente">›</button>
  </div>
</header>

<main>
  <section class="panel" id="p-hoy" aria-label="Hoy"></section>
  <section class="panel" id="p-semana" aria-label="Semana"></section>
  <section class="panel" id="p-cocina" aria-label="Cocina"></section>
  <section class="panel" id="p-hist" aria-label="Historial"></section>
  <section class="panel" id="p-guia" aria-label="Guía"></section>
  <section class="panel" id="p-ajustes" aria-label="Ajustes"></section>
</main>

<nav class="tabs" aria-label="Secciones"><div>
  <button data-action="tab" data-tab="hoy" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="6.5"/><path d="M8.5 8.5a3.5 3.5 0 0 1 7 0"/></svg>Hoy</button>
  <button data-action="tab" data-tab="semana">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</button>
  <button data-action="tab" data-tab="cocina">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 4c0 2 1.5 2 1.5 4M13.5 4c0 2 1.5 2 1.5 4"/></svg>Cocina</button>
  <button data-action="tab" data-tab="hist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>Progreso</button>
  <button data-action="tab" data-tab="guia">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg>Guía</button>
  <button data-action="tab" data-tab="ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Ajustes</button>
</div></nav>

<div class="timer" id="timer" role="dialog" aria-modal="true" aria-labelledby="tLabel">
  <div class="t-label" id="tLabel"></div>
  <div class="t-phase" id="tPhase"></div>
  <div class="t-big" id="tBig" aria-live="off">0:00</div>
  <div class="t-marks" id="tMarks"></div>
  <div class="t-btns">
    <button class="btn accent" data-action="timer-stop" id="tStop">Parar y guardar</button>
    <button class="btn" data-action="timer-cancel">Cancelar</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="sr" aria-label="Importar copia de seguridad">

<script>
"use strict";
const VERSION = "2.2.1";
const KEY = "correctivo.v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------- Datos ---------------- */
function fresh(){
  return { version:1, settings:{ side:"izq", buKg:12, cxKg:24, leadIn:5,
    sched:{0:"r",1:"t",2:"r",3:"t",4:"r",5:"t",6:"o"} }, days:{} };
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.days && d.settings) { const f = fresh(); d.settings = Object.assign(f.settings, d.settings); return d; }
  }catch(e){}
  return fresh();
}
let DB = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("No se ha podido guardar en el móvil"); }
}
const getp = (o, path) => path.split(".").reduce((a, k) => (a == null ? undefined : a[k]), o);
function setp(o, path, v){
  const ks = path.split("."); let a = o;
  for (let i = 0; i < ks.length - 1; i++){ if (a[ks[i]] == null || typeof a[ks[i]] !== "object") a[ks[i]] = {}; a = a[ks[i]]; }
  if (v === undefined) delete a[ks[ks.length-1]]; else a[ks[ks.length-1]] = v;
}

/* ---------------- Fechas ---------------- */
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayIso = () => iso(new Date());
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate()+n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
const DOW = ["dom","lun","mar","mié","jue","vie","sáb"];
const DOWL = ["D","L","M","X","J","V","S"];
const MON = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmtDate = s => { const d = parseIso(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
const fmtSecs = s => s == null ? "—" : `${Math.floor(s/60)}:${pad(Math.floor(s%60))}`;

/* ---------------- Estado de UI ---------------- */
const ui = { tab:"hoy", date: todayIso(), open:{ p3:true, extras:false, air:false, a:true, b:true, cierre:true, opt:false, retest:false, compra:true, pesc:true, menu:true, tanda:false, desp:false }, tables:{}, forceTrain:{} };
const day = (d = ui.date) => DB.days[d] || {};
const wday = (d = ui.date) => (DB.days[d] ||= {});
const S = () => DB.settings;
const sideL = () => S().side === "izq" ? "izquierdo" : "derecho";
const otherL = () => S().side === "izq" ? "derecho" : "izquierdo";
const dayType = d => S().sched[parseIso(d).getDay()] || "r";

/* ---------------- Contenido ---------------- */
const P3 = [
  { k:"supino", t:"Supino", s:"Respiración diafragmática + neck nods + rotaciones de cabeza" },
  { k:"slIzq",  t:"Side lying · izquierdo", s:"Respiración en la posición" },
  { k:"slDer",  t:"Side lying · derecho", s:"Respiración en la posición" },
  { k:"prono",  t:"Prono", s:"Respiración + nods + rotaciones" },
  { k:"deadbug",t:"Dead Bug", s:"Rodilla flexionada → pierna recta al llegar cómodo a 30" },
];
const CX = [
  { k:"clean", t:"Doble Clean", r:"×5" },
  { k:"squat", t:"Doble Front Squat", r:"×5" },
  { k:"swing", t:"Doble Swing", r:"×10" },
  { k:"row",   t:"Remo doble en bisagra", r:"×8" },
  { k:"carry", t:"Farmer's Carry", r:"20-30 m" },
];
const KGS = [8,12,16,20,24,28,32];

/* ---------------- Componentes ---------------- */
function stepper(path, o){
  const v = getp(day(), path);
  const cls = o.metric ? "field metric" : "field";
  return `<div class="${cls}"><label>${esc(o.label)}</label>
    <div class="stepper" role="group" aria-label="${esc(o.label)}">
      <button data-action="step" data-path="${path}" data-d="-${o.step||1}" data-def="${o.def}" data-min="${o.min??0}" aria-label="Menos">−</button>
      <output class="${v == null ? "empty" : ""}">${v == null ? "—" : esc(v)}</output>
      <button data-action="step" data-path="${path}" data-d="${o.step||1}" data-def="${o.def}" data-min="${o.min??0}" aria-label="Más">+</button>
    </div></div>`;
}
function toggle(path, label){
  const on = !!getp(day(), path);
  return `<button class="chip sm" data-action="toggle" data-path="${path}" aria-pressed="${on}">${on ? "✓ " : ""}${esc(label)}</button>`;
}
function check(path, label, sub){
  const on = !!getp(day(), path);
  return `<button class="check" data-action="toggle" data-path="${path}" aria-pressed="${on}">
    <span class="box">${on ? "✓" : ""}</span><span class="lbl">${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span></button>`;
}
function kgChips(path, def, list = KGS){
  const v = getp(day(), path) ?? def;
  return `<div class="field"><label>Kg</label><div class="chips">${list.map(k =>
    `<button class="chip sm" data-action="set" data-path="${path}" data-v="${k}" data-num="1" aria-pressed="${v===k}">${k}</button>`).join("")}</div></div>`;
}
function timerField(path, label, o = {}){
  const v = getp(day(), path);
  return `<div class="field"><label>${esc(label)}</label>
    <div class="row" style="gap:10px"><span class="timer-val${v == null ? " empty" : ""}">${v == null ? "—" : v + " s"}</span>
    <button class="timer-btn" data-action="timer-start" data-path="${path}" data-label="${esc(label)}" data-marks="${o.marks||""}" data-lead="${o.lead?1:0}" data-kind="hold">▶ Cronometrar</button>
    ${v != null ? `<button class="link" data-action="clear" data-path="${path}">borrar</button>` : ""}</div></div>`;
}
const CARD_ICO = { p3:"P3", extras:"＋", a:"A", b:"B", cierre:"✓", air:"≋", compra:"≡", pesc:"≈", menu:"M", tanda:"T", desp:"D" };
function card(key, title, sub, badge, body){
  const closed = !ui.open[key];
  const ico = CARD_ICO[key];
  return `<div class="card k-${key}${closed ? " closed" : ""}" id="card-${key}">
    <button class="card-h" data-action="card" data-key="${key}" aria-expanded="${!closed}">
      ${ico ? `<span class="ico" aria-hidden="true">${ico}</span>` : ""}<h2>${title}${sub ? `<span class="sub">${sub}</span>` : ""}</h2>${badge || ""}<span class="chev" aria-hidden="true">▾</span></button>
    <div class="card-b">${body}</div></div>`;
}

/* ---------------- Cálculos ---------------- */
const p3Done = d => P3.filter(i => getp(d, "p3."+i.k+".done")).length;
const FZ = [
  { k:"fsq",   t:"Doble front squat", r:"5×5 → 5×8, luego siguiente pareja", kgs:[16,20,24,28,32], s:5, n:5, unit:"reps", pair:true },
  { k:"swing", t:"Swing a dos manos · una campana", r:"5×10 · plancha de pie arriba", kgs:[16,20,24,28,32,36,40], s:5, n:10, unit:"reps" },
  { k:"row",   t:"Remo doble en bisagra", r:"5×6-8", kgs:[16,20,24,28], s:5, n:6, unit:"reps", pair:true },
  { k:"carry", t:"Suitcase carry · una campana", r:"3 paseos por lado, sin ladearte", kgs:[16,20,24,28,32], s:3, n:1, unit:"paseos/lado" },
];
const AIR = ["Adaptación", "A&A", "Alta estimulación", "Rodaje suave", "Test", "Otro"];
// Plan de airbike (adaptado de las ideas de Building the Engine, con la fuerza como prioridad)
const AIRPLAN = {
  1: { aa:{ on:5, off:30, reps:[12,15,18,20] }, hs:{ on:15, off:15, reps:[8,10,12,14] }, easy:"20-25 min" },
  2: { aa:{ on:7, off:35, reps:[12,15,18,18] }, hs:{ on:20, off:20, reps:[10,12,14,16] }, easy:"25-30 min" },
};
function airWeek(date){
  const st = S().airStart; if (!st) return null;
  const n = Math.floor(daysBetween(st, date) / 7);
  if (n < 0) return { phase:"pre" };
  const cyc = n % 9; // 8 semanas de bloques + 1 de retest/descarga
  if (cyc === 8) return { phase:"retest", cycle: Math.floor(n / 9) + 1 };
  return { phase:"block", block: cyc < 4 ? 1 : 2, week: (cyc % 4) + 1, cycle: Math.floor(n / 9) + 1 };
}
function airSuggest(date){
  const w = airWeek(date), dow = parseIso(date).getDay(), t = S().airTests || {};
  const W = t.maxW ? `${Math.round(t.maxW * 0.85)}-${Math.round(t.maxW * 0.87)} W` : "85-87 % de tu potencia máxima";
  const HS = t.mas ? `${Math.round(t.mas * 1.2)} RPM` : "120 % de tu MAS";
  const EZ = t.mas ? `unas ${Math.round(t.mas * 0.7)} RPM` : "ritmo de conversación (~70 % de tu MAS)";
  if (!w || w.phase === "pre") return { tipo:"Adaptación", txt:"Adaptación: 10 × 15 s fuerte / 45 s muy suave. Al final de la segunda semana, haz los tests y pon la fecha de inicio del bloque 1 en Ajustes." };
  if (w.phase === "retest") return { tipo:"Test", txt:"Semana de retest y descarga: sprint de 10 s (vatios máximos) y 5 min a tope (RPM medias). El resto de la semana, solo rodaje suave." };
  const P = AIRPLAN[w.block], i = w.week - 1, lab = `Bloque ${w.block} · semana ${w.week}`;
  if (dow === 1) return { tipo:"A&A", txt:`${lab} · A&A: ${P.aa.reps[i]} × ${P.aa.on} s / ${P.aa.off} s muy suave, a ${W}. Salida lanzada.` };
  if (dow === 5) return { tipo:"Alta estimulación", txt:`${lab} · Alta estimulación: ${P.hs.reps[i]} × ${P.hs.on} s a ${HS} / ${P.hs.off} s suave.` };
  if (dow === 0 || dow === 6) return { tipo:"Rodaje suave", txt:`${lab} · Rodaje suave opcional: ${P.easy} a ${EZ}.` };
  return { tipo:null, txt:`${lab}. Hoy no toca airbike: lunes A&A, viernes alta estimulación, fin de semana rodaje suave.` };
}
const airDone = d => !!getp(d, "air.done");
const p3Full = d => P3.every(i => getp(d, "p3." + i.k + ".done"));
const trainedDay = d => hasA(d) || hasB(d);
const activeDay = d => p3Done(d) > 0 || trainedDay(d) || airDone(d) || !!getp(d, "paseo.done") || Object.keys(d.extra || {}).some(k => d.extra[k] && d.extra[k].done);
const fzDone = d => FZ.filter(e => getp(d, "b.f."+e.k+".done")).length;
const hasB = d => (getp(d, "b.rounds") || []).length > 0 || fzDone(d) > 0;
const bMode = (d, date) => getp(d, "b.mode") || ([1,5].includes(parseIso(date).getDay()) ? "fuerza" : "complejo");
function lastFz(k, ref){
  const ds = Object.keys(DB.days).filter(x => x < ref && getp(DB.days[x], "b.f."+k+".done")).sort();
  return ds.length ? { date: ds[ds.length-1], v: getp(DB.days[ds[ds.length-1]], "b.f."+k) } : null;
}
const roundsDone = d => (getp(d, "b.rounds") || []).filter(r => CX.every(c => r[c.k])).length;
const CXKGS = [12,16,20,24,28,32];
const roundKg = (d, r) => r.kg ?? getp(d, "b.kg");
const roundKgs = d => (getp(d, "b.rounds") || []).map(r => roundKg(d, r)).filter(k => k != null);
const maxBkg = d => { const k = roundKgs(d); return k.length ? Math.max(...k) : (getp(d, "b.kg") ?? null); };
function kgSummary(d){
  const k = roundKgs(d); if (!k.length) return (getp(d, "b.kg") ?? "?") + " kg";
  const seq = k.filter((x, i) => i === 0 || x !== k[i-1]);
  return seq.join("→") + " kg";
}
function syncBkg(d){ // fija el peso en las rondas antiguas (sin kg propio) antes de recalcular el máximo
  if (!d.b) return; (d.b.rounds || []).forEach(r => { if (r.kg == null && d.b.kg != null) r.kg = d.b.kg; });
  const m = roundKgs(d); if (m.length) d.b.kg = Math.max(...m);
}
const hasA = d => !!d.a && Object.keys(d.a).some(k => k !== "retest");
function lastRetest(before){
  const ds = Object.keys(DB.days).filter(x => x <= before && getp(DB.days[x], "a.retest.done")).sort();
  return ds.length ? ds[ds.length-1] : null;
}
function retestDue(ref){
  const lr = lastRetest(ref);
  return { last: lr, days: lr ? daysBetween(lr, ref) : null, due: !lr || daysBetween(lr, ref) >= 14 };
}
function prevB(ref){
  return Object.keys(DB.days).filter(x => x < ref && (getp(DB.days[x], "b.rounds") || []).length).sort();
}
function p3Streak(){
  let d = todayIso(); let n = 0;
  if (p3Done(day(d)) < P3.length) d = addDays(d, -1);
  while (p3Done(day(d)) === P3.length){ n++; d = addDays(d, -1); }
  return n;
}

/* ---------------- Render: cabecera ---------------- */
function renderTop(){
  const t = ui.date === todayIso();
  $("#topTitle").innerHTML = `${t ? "Hoy" : esc(fmtDate(ui.date))}<small>${t ? esc(fmtDate(ui.date)) : "editando un día pasado"}</small>`;
  $("#btnNext").disabled = ui.date >= todayIso();
  $("#btnToday").style.visibility = t ? "hidden" : "visible";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
}

/* ---------------- Render: sesión ---------------- */
function renderHoy(){
  const d = day(); const type = dayType(ui.date);
  const train = type !== "r" || ui.forceTrain[ui.date] || hasA(d) || hasB(d);
  const chip = type === "t" ? `<span class="daychip">${S().mant ? "Entreno · mantenimiento" : "Día de entreno"}</span>`
             : type === "o" ? `<span class="daychip opt">Opcional · ligero</span>`
             : `<span class="daychip rest">Descanso activo · solo P3</span>`;
  const mant = !!S().mant;
  const lead = type === "t" ? (mant ? "Modo mantenimiento: P3 → Bloque A → una ronda corta de fuerza. 30 minutos." : "P3 → Bloque A en fresco → Bloque B.")
             : type === "o" ? "Comodín: recupera aquí la sesión perdida de la semana. Si no falta ninguna, paseo largo o comba."
             : "Descanso activo: P3 y paseo con los temas.";
  const xn = Object.keys(d.extra || {}).filter(k => d.extra[k] && d.extra[k].done).length;
  const aKeys = ["bu","arr","tgu","hk","pie","oh"]; const an = aKeys.filter(k => d.a && d.a[k] && Object.keys(d.a[k]).length).length;
  const bn = bMode(d, ui.date) === "fuerza" ? fzDone(d) / FZ.length : Math.min(1, roundsDone(d) / 3);
  const cn = [d.finDia, getp(d,"paseo.done"), getp(d,"hab.prot") != null, d.notas].filter(Boolean).length / 4;
  const seg = (k, label, frac, off) => `<button class="s-${k}${frac >= 1 ? " done" : ""}${off ? " off" : ""}" data-action="jump" data-key="${k}"><span>${label}</span><span class="bar"><i style="width:${Math.round(Math.min(1, frac) * 100)}%"></i></span></button>`;
  const bfrac = Math.max(bn, airDone(d) ? 1 : 0);
  const parts = train ? [p3Done(d) / P3.length, Math.min(1, xn / 2), an / aKeys.length, bfrac, cn] : [p3Done(d) / P3.length, Math.min(1, xn / 2), cn, getp(d, "paseo.done") ? 1 : 0];
  const pct = Math.round(parts.reduce((a, x) => a + Math.min(1, x), 0) / parts.length * 100);
  const C = 2 * Math.PI * 32;
  const longDate = (() => { const dd = parseIso(ui.date); const MES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"]; const DIA = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"]; return `${DIA[dd.getDay()]} ${dd.getDate()} de ${MES[dd.getMonth()]}`; })();
  let h = `<div class="hero">
      <div class="ring" role="img" aria-label="Día completado al ${pct} %"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg><b>${pct}%</b></div>
      <div class="txt">${chip}<h1>${longDate}</h1><p class="hint">${lead}</p></div></div>
    <div class="daystrip" role="group" aria-label="Progreso del día">
      ${seg("p3", "P3", p3Done(d) / P3.length)}${seg("extras", "Core", Math.min(1, xn / 2))}${seg("a", "Bloque A", an / aKeys.length, !train)}${seg("b", "Bloque B", bfrac, !train)}${seg("cierre", "Cierre", cn)}
    </div>`;

  const sleep = d.sueno;
  h += `<div class="card k-sleep"><div class="card-h" style="cursor:default"><span class="ico" aria-hidden="true">☾</span><h2>Mañana<span class="sub">Sueño, energía y suplementos</span></h2></div><div class="card-b">
    <div class="row">
      <div class="field"><label>Cómo has dormido</label><div class="chips">
        ${["bien","regular","mal"].map(v => `<button class="chip sm" data-action="set" data-path="sueno" data-v="${v}" aria-pressed="${sleep===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join("")}</div></div>
      <div class="field"><label>Energía</label><div class="chips">
        ${[1,2,3,4,5].map(v => `<button class="chip sm" data-action="set" data-path="energia" data-v="${v}" data-num="1" aria-pressed="${d.energia===v}">${v}</button>`).join("")}</div></div>
    </div>
    <div class="row" style="margin-top:10px">${stepper("despertares", { label:"Despertares esta noche", def:1 })}
      ${toggle("hab.luz", "Anoche, luz apagada antes de las 23:30")}</div>

function chartCard(id, title, sub, ser, unit){
  const has = ser.some(s => s.pts.length);
  let body;
  if (!has) body = `<p class="hint">Aparecerá cuando registres este dato.</p>`;
  else if (ui.tables[id]){
    const xs = [...new Set(ser.flatMap(s => s.pts.map(p => p.x)))].sort();
    body = `<table class="t"><thead><tr><th>Día</th>${ser.map(s => `<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${
      xs.map(x => `<tr><td>${esc(fmtDate(x))}</td>${ser.map(s => { const p = s.pts.find(q => q.x === x); return `<td>${p ? p.y : "—"}</td>`; }).join("")}</tr>`).join("")}</tbody></table>`;
  } else body = lineChart(id, ser, unit);
  const legend = ser.length > 1 && has && !ui.tables[id] ? `<div class="legend">${ser.map(s => `<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="card"><div class="card-b" style="padding-top:12px">
    <h2 style="font-size:16px;margin:0">${esc(title)}</h2><p class="hint" style="margin:2px 0 6px">${esc(sub)}</p>
    ${legend}${body}${has ? `<button class="link" data-action="tbl" data-id="${id}">${ui.tables[id] ? "Ver gráfica" : "Ver tabla"}</button>` : ""}</div></div>`;
}
function lineChart(id, ser, unit){
  const xs = [...new Set(ser.flatMap(s => s.pts.map(p => p.x)))].sort();
  const W = 340, H = 170, L = 30, R = 44, T = 12, B = 26;
  const maxY = Math.max(1, ...ser.flatMap(s => s.pts.map(p => p.y)));
  const niceMax = maxY <= 5 ? 5 : maxY <= 10 ? 10 : Math.ceil(maxY / 5) * 5;
  const X = i => xs.length === 1 ? L + (W-L-R)/2 : L + i * (W-L-R) / (xs.length-1);
  const Y = v => T + (H-T-B) * (1 - v / niceMax);
  let g = "";
  [0, niceMax/2, niceMax].forEach(v => {
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${+v.toFixed(1)}</text>`;
  });
  const lbl = [0, xs.length-1].filter((v,i,a) => a.indexOf(v) === i);
  lbl.forEach(i => { const d = parseIso(xs[i]); g += `<text x="${X(i)}" y="${H-6}" text-anchor="${xs.length===1?"middle":i===0?"start":"end"}" font-size="11" fill="var(--ink-3)">${d.getDate()} ${MON[d.getMonth()]}</text>`; });
  ser.forEach(s => {
    if (!s.pts.length) return;
    const pts = s.pts.map(p => [X(xs.indexOf(p.x)), Y(p.y)]);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
    pts.forEach(p => g += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.c}" stroke="var(--surface)" stroke-width="2"/>`);
    const last = pts[pts.length-1], lv = s.pts[s.pts.length-1].y;
    g += `<text x="${last[0]+8}" y="${last[1]+4}" font-size="12" font-weight="600" fill="var(--ink-2)">${lv}${unit.trim()==="s"?" s":""}</text>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  const data = esc(JSON.stringify({ xs, ser: ser.map(s => ({ n:s.name, c:s.c, pts:s.pts })), L, R, W, unit }));
  return `<div class="chart" data-chart="${data}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de evolución">${g}</svg><div class="tip"></div></div>`;
}
function chartHover(el, ev){
  const cfg = JSON.parse(el.dataset.chart); const svg = el.querySelector("svg"); const tip = el.querySelector(".tip");
  const r = svg.getBoundingClientRect(); const sx = (ev.clientX - r.left) * cfg.W / r.width;
  const n = cfg.xs.length; if (!n) return;
  let i = n === 1 ? 0 : Math.round((sx - cfg.L) / ((cfg.W - cfg.L - cfg.R) / (n-1)));
  i = Math.max(0, Math.min(n-1, i));
  const x = cfg.xs[i];
  const px = n === 1 ? cfg.L + (cfg.W-cfg.L-cfg.R)/2 : cfg.L + i*(cfg.W-cfg.L-cfg.R)/(n-1);
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
  const rows = cfg.ser.map(s => { const p = s.pts.find(q => q.x === x); return p ? `<div><i style="display:inline-block;width:10px;height:3px;background:${s.c};vertical-align:middle;margin-right:6px"></i>${esc(s.n)}: <b>${p.y}${cfg.unit}</b></div>` : ""; }).join("");
  tip.innerHTML = `<div class="muted">${esc(fmtDate(x))}</div>${rows || '<div class="muted">sin dato</div>'}`;
  tip.style.display = "block";
  const left = px * r.width / cfg.W; const tw = tip.offsetWidth;
  tip.style.left = Math.max(0, Math.min(r.width - tw, left - tw/2)) + "px"; tip.style.top = "-6px";
}

  <li>Café solo hasta las 14:00; por la tarde, kukicha o malta.</li>
  <li>Unos 150 g de proteína al día en 3-4 tomas: pescado, huevos, legumbres, tofu, tempeh, suero. Plato: mitad verduras, un cuarto proteína, un cuarto integrales.</li>
  <li>Cintura cada dos semanas y peso 3 días por semana, en ayunas.</li></ul>
  <h3>Cocina</h3>
  <ul><li>Viernes: revisa la despensa y compra con la lista. Sábado o domingo: una hora de tanda (arroz, legumbre o caldo, verduras al horno, huevos).</li>
  <li>Menú con platos tipo que se repiten: elige primero la proteína.</li>
  <li><b>Bonito o atún: máximo 3 raciones a la semana.</b> El resto de latas, caballa, sardinas o mejillones (mercurio bajo). Fuera de la lista: pez espada, atún rojo, tiburón y lucio.</li></ul>
  <h3>Cómo leer cada serie</h3>
  <ul><li><b>Ardor con la costilla en su sitio:</b> correcto. Es la cadena lateral trabajando; sigue.</li>
  <li><b>La costilla cede:</b> para esa repetición ahí. No termines el rango «aunque sea con algo de flare».</li>
  <li><b>Dolor</b> (no ardor): para la sesión y consúltalo. Cambia todo el planteamiento.</li></ul>
  <h3>Orden de la sesión</h3>
  <p>P3 → Bloque A en fresco (necesita atención) → Bloque B (bilateral, se puede cansar sin riesgo para el patrón).</p>
  <h3>Cuándo subir peso</h3>
  <ul><li>Nunca por sensación ni por calendario: «se siente ligero» no es «está limpio».</li>
  <li>Solo con dos sesiones seguidas confirmadas en vídeo con el patrón limpio.</li>
  <li>En el correctivo, progresa antes en rango y repeticiones que en kilos.</li></ul>
  <h3>Señales de progreso</h3>
  <ul><li>Más reps antes del ardor en half kneeling y de pie.</li>
  <li>Más reps limpias tras el bottoms-up, y que salgan igual sin él.</li>
  <li>Overhead hold ${S_} acercándose al otro lado.</li>
  <li>Transferencias que no entrenas directamente (recepción del clean más simétrica, dorsales igualándose).</li></ul>
  <h3>Puertas de salida</h3>
  <ul><li><b>A la fase 2</b> (double trigger, más volumen de holds): cuando el ardor ${S_} tarde en aparecer lo mismo que en el otro lado.</li>
  <li><b>A la fase 3</b> (doble press desde 6-8 kg, see-saw press como puente): cuando press y overhead hold ${S_} sean simétricos sin ayuda consciente.</li>
  <li><b>Snatch a una mano, swing a una mano:</b> tras la puerta de la fase 2.</li>
  <li><b>Snatch doble, clean &amp; jerk:</b> con el doble press de 24 kg limpio y «aburrido».</li>
  <li><b>Complejos largos</b> (Lucky 13, Kettlebell Muscle, The Wolf): cuando el patrón aguante limpio en vídeo bajo fatiga moderada.</li></ul>
  <h3>Qué evitar por ahora</h3>
  <ul><li>Cualquier press fuera del Bloque A.</li><li>Snatch, windmill, jerk y swing a una mano.</li>
  <li>Renegade row (anti-rotación en plancha sin testear).</li><li>Complejos completos con press.</li></ul>
  <h3>Cómo grabarte</h3>
  <p>De perfil, cámara a la altura de la cadera, clips cortos: bottoms-up, la serie normal de después, half kneeling con alguna sonda, de pie y overhead hold.</p>
  </div></div>`;
}

  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id === "p-" + ui.tab));

/* ---------------- Temporizador ---------------- */
const T = { on:false };
let actx = null, wakeLock = null;
function beep(freq = 880, ms = 160){
  try{
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.35, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + ms/1000);
    o.start(); o.stop(actx.currentTime + ms/1000 + 0.02);
  }catch(e){}
}
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} };
async function lockScreen(){ try{ if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
function timerStart(o){
  Object.assign(T, { on:true, path:o.path, label:o.label, kind:o.kind, marks:o.marks, idx:o.idx,
    lead: o.lead ? S().leadIn : 0, t0: performance.now(), hit: new Set(), lastLeadSec: null });
  if (actx && actx.state === "suspended") actx.resume();
  beep(1, 1); // desbloquea el audio con el gesto del usuario
  $("#tLabel").textContent = o.label;
  $("#tMarks").textContent = o.marks.length ? "Avisos: " + o.marks.map(m => m >= 60 ? fmtSecs(m) : m + " s").join(" · ") : "";
  $("#tStop").textContent = o.kind === "rest" ? "Listo, recuperado" : "Parar y guardar";
  $("#timer").classList.add("on");
  lockScreen(); tick(); T.iv = setInterval(tick, 100);
}
function tick(){
  if (!T.on) return;
  const el = (performance.now() - T.t0) / 1000;
  const big = $("#tBig"), ph = $("#tPhase");
  if (el < T.lead){
    const left = Math.ceil(T.lead - el);
    big.textContent = left; big.className = "t-big lead"; ph.textContent = "Colócate: empieza al pitido";
    if (left <= 3 && T.lastLeadSec !== left){ T.lastLeadSec = left; beep(660, 90); }
    return;
  }
  if (T.lead && !T.hit.has("go")){ T.hit.add("go"); beep(990, 260); vib(120); }
  const s = el - T.lead;
  big.textContent = fmtSecs(s);
  big.className = "t-big" + (T.marks.some(m => s >= m) ? " hit" : "");
  ph.textContent = T.kind === "rest" ? "Descansa hasta sentirte recuperado" : "Para en cuanto la costilla ceda";
  T.marks.forEach(m => { if (s >= m && !T.hit.has(m)){ T.hit.add(m); beep(1175, 220); setTimeout(() => beep(1175, 220), 280); vib([150, 80, 150]); } });
}
function timerEnd(keep){
  if (!T.on) return;
  clearInterval(T.iv); T.on = false; unlockScreen(); $("#timer").classList.remove("on");
  const secs = Math.max(0, Math.round((performance.now() - T.t0) / 1000 - T.lead));
  if (keep){
    if (T.kind === "rest"){ const r = getp(wday(), "b.rounds"); if (r && r[T.idx]) r[T.idx].rest = secs; }
    else setp(wday(), T.path, secs);
    save(); toast(T.kind === "rest" ? `Descanso: ${fmtSecs(secs)}` : `Guardado: ${secs} s`);
  }
  render();
}
document.addEventListener("visibilitychange", () => { if (T.on && document.visibilityState === "visible") lockScreen(); });

/* ---------------- Acciones ---------------- */
let saveTimer = null;
function commit(){ save(); render(); }
const A = {
  "tab": b => { ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); },
  "day-prev": () => { ui.date = addDays(ui.date, -1); render(); },
  "day-next": () => { if (ui.date < todayIso()) { ui.date = addDays(ui.date, 1); render(); } },
  "day-today": () => { ui.date = todayIso(); render(); },
  "card": b => { ui.open[b.dataset.key] = !ui.open[b.dataset.key]; render(); },
  "step": b => {
    const p = b.dataset.path, dlt = Number(b.dataset.d), def = Number(b.dataset.def), min = Number(b.dataset.min);
    const d = wday(); const v = getp(d, p);
    const kgDef = { "a.bu.": S().buKg, "a.tgu.": S().buKg };
    for (const pre in kgDef) if (p.startsWith(pre) && getp(d, pre + "kg") == null) setp(d, pre + "kg", kgDef[pre]);
    let nv;
    if (v == null) nv = def;
    else if (dlt < 0 && v <= min) nv = undefined;   // por debajo del mínimo = sin dato
    else nv = Math.max(min, v + dlt);
    setp(d, p, nv); commit();
  },
  "toggle": b => {
    const d = wday(); const p = b.dataset.path; setp(d, p, getp(d, p) ? undefined : true);
    const m = p.match(/^b\.f\.(\w+)\.done$/);
    if (m && getp(d, p)){ const e = FZ.find(x => x.k === m[1]); const last = lastFz(m[1], ui.date); const base = "b.f." + m[1];
      if (getp(d, base + ".kg") == null && last && last.v && last.v.kg) setp(d, base + ".kg", last.v.kg);
      if (getp(d, base + ".series") == null) setp(d, base + ".series", e.s);
      if (getp(d, base + ".reps") == null) setp(d, base + ".reps", e.n); }
    commit();
  },
  "set": b => {
    const d = wday(); const p = b.dataset.path; const v = b.dataset.num ? Number(b.dataset.v) : b.dataset.v;
    setp(d, p, getp(d, p) === v ? undefined : v); commit();
  },
  "clear": b => { setp(wday(), b.dataset.path, undefined); commit(); },
  "force-train": () => { ui.forceTrain[ui.date] = true; render(); },
  "timer-start": b => timerStart({ path:b.dataset.path, label:b.dataset.label, kind:"hold",
    marks:(b.dataset.marks || "").split(",").filter(Boolean).map(Number), lead:b.dataset.lead === "1" }),
  "rest-start": b => timerStart({ kind:"rest", idx:Number(b.dataset.i), label:`Descanso tras la ronda ${Number(b.dataset.i)+1}`, marks:[90,120], lead:false }),
  "timer-stop": () => timerEnd(true),
  "timer-cancel": () => timerEnd(false),
  "mant": b => { S().mant = b.dataset.v === "1"; commit(); },
  "jump": b => {
    const k = b.dataset.key; if ((k === "a" || k === "b") && !document.getElementById("card-" + k)){ ui.forceTrain[ui.date] = true; }
    ui.open[k] = true; render();
    const el = document.getElementById("card-" + k); if (el){ const y = el.getBoundingClientRect().top + window.scrollY - 76; window.scrollTo({ top: y, behavior: "smooth" }); }
  },
  "air-save-tests": () => {
    const v = getp(wday(), "air") || {};
    if (!v.testW && !v.testRPM){ toast("Primero apunta los vatios máximos y las RPM medias"); return; }
    const t = S().airTests || {}; if (v.testW) t.maxW = v.testW; if (v.testRPM) t.mas = v.testRPM; t.date = ui.date; S().airTests = t;
    if (!S().airStart){ const dw = parseIso(ui.date).getDay(); S().airStart = addDays(ui.date, dw === 1 ? 7 : (8 - dw) % 7 || 7); }
    commit(); toast("Tests guardados: los ritmos se calculan con ellos");
  },
  "c-wk": b => { ui.cwk = Math.max(-8, Math.min(1, (ui.cwk || 0) + Number(b.dataset.d))); render(); },
  "c-desp": b => { const c = K(), k = b.dataset.k, nx = { hay:"poco", poco:"falta", falta:"hay" }; const v = nx[c.desp[k] || "hay"];
    if (v === "hay"){ delete c.desp[k]; delete c.carro[k]; } else c.desp[k] = v; commit(); },
  "c-carro": b => { const c = K(), k = b.dataset.k; if (c.carro[k]) delete c.carro[k]; else c.carro[k] = true; commit(); },
  "c-compra-hecha": () => { const c = K(); const ks = Object.keys(c.carro); ks.forEach(k => { delete c.desp[k]; delete c.carro[k]; }); commit(); toast(`${ks.length} productos a la despensa`); },
  "c-share": async () => {
    const list = shopList(); if (!list.length) return;
    const groups = {}; list.forEach(i => (groups[i.cat] ||= []).push(i));
    const txt = "Compra\n" + Object.keys(groups).map(cat => `\n${cat}\n` + groups[cat].map(i => `- ${i.t}`).join("\n")).join("\n");
    try{ if (navigator.share){ await navigator.share({ title:"Lista de la compra", text:txt }); return; } }catch(e){ if (e.name === "AbortError") return; }
    try{ await navigator.clipboard.writeText(txt); toast("Lista copiada"); }catch(e){ toast("No se ha podido copiar"); }
  },
  "c-suelta": b => { const c = K(), p = cWeek() + "." + b.dataset.k; const v = Math.max(0, (getp(c.sueltas, p) || 0) + Number(b.dataset.d)); setp(c.sueltas, p, v || undefined); commit(); },
  "c-tanda": b => { const c = K(), wk = cWeek(); c.tanda[wk] ||= {}; if (c.tanda[wk][b.dataset.k]) delete c.tanda[wk][b.dataset.k]; else c.tanda[wk][b.dataset.k] = true; commit(); },
  "c-copy-menu": () => { const c = K(), wk = cWeek(), prev = c.menu[addDays(wk, -7)];
    if (!prev || !Object.keys(prev).length){ toast("La semana anterior no tiene menú"); return; }
    if (c.menu[wk] && Object.keys(c.menu[wk]).length && !confirm("¿Sustituir el menú de esta semana por el de la anterior?")) return;
    c.menu[wk] = { ...prev }; commit(); },
  "c-clear-menu": () => { const c = K(); if (confirm("¿Vaciar el menú de esta semana?")){ delete c.menu[cWeek()]; commit(); } },
  "c-add-plato": () => { const t = ($("#cPlatoName").value || "").trim(); if (!t){ toast("Escribe el nombre del plato"); return; }
    const f = $("#cPlatoFish").value || undefined; K().platos.push({ k:"u" + Date.now().toString(36), t, f }); commit(); toast("Plato añadido al menú"); },
  "c-del-plato": b => { const c = K(), pl = c.platos.find(p => p.k === b.dataset.k); if (!pl || !confirm(`¿Quitar «${pl.t}» de los platos tipo?`)) return;
    c.platos = c.platos.filter(p => p !== pl); Object.values(c.menu).forEach(m => Object.keys(m).forEach(s => { if (m[s] === pl.k) delete m[s]; })); commit(); },
  "c-edit": () => { ui.cEdit = !ui.cEdit; render(); },
  "c-hide": b => { const c = K(), k = b.dataset.k; if (c.oculto[k]) delete c.oculto[k]; else { c.oculto[k] = true; delete c.desp[k]; delete c.carro[k]; } commit(); },
  "c-add-prod": () => { const t = ($("#cProdName").value || "").trim(); if (!t){ toast("Escribe el producto"); return; }
    K().propios.push({ k:"u" + Date.now().toString(36), t, cat:$("#cProdCat").value }); commit(); },
  "c-del-prod": b => { const c = K(), k = b.dataset.k; c.propios = c.propios.filter(p => p.k !== k); delete c.desp[k]; delete c.carro[k]; commit(); },
  "wk": b => { ui.wk = Math.min(0, (ui.wk || 0) + Number(b.dataset.d)); render(); },
  "set-bmode": b => { const d = wday(); d.b ||= {}; d.b.mode = b.dataset.v; commit(); },
  "round-add": () => {
    const d = wday(); d.b ||= {}; d.b.rounds ||= [];
    const prevR = d.b.rounds[d.b.rounds.length - 1];
    const kg = prevR ? roundKg(d, prevR) : (lastBkg() ?? S().cxKg);
    d.b.rounds.push({ kg }); syncBkg(d); commit();
  },
  "round-kg": b => {
    const d = wday(); const r = d.b.rounds[Number(b.dataset.i)]; if (!r) return;
    syncBkg(d); r.kg = Number(b.dataset.v); syncBkg(d); commit();
  },
  "round-del": () => { const d = wday(); const r = getp(d, "b.rounds"); if (r && r.length && confirm("¿Quitar la última ronda?")) { r.pop(); syncBkg(d); commit(); } },
  "round-item": b => {
    const d = wday(); const r = d.b.rounds[Number(b.dataset.i)]; const k = b.dataset.k;
    const was = CX.every(c => r[c.k]);
    r[k] = !r[k]; save(); render();
    const now = CX.every(c => r[c.k]);
    if (!was && now && ui.date === todayIso() && r.rest == null && Number(b.dataset.i) === d.b.rounds.length - 1)
      timerStart({ kind:"rest", idx:Number(b.dataset.i), label:`Descanso tras la ronda ${Number(b.dataset.i)+1}`, marks:[90,120], lead:false });
  },
  "goto-day": b => { ui.date = b.dataset.d; ui.tab = "hoy"; render(); window.scrollTo(0, 0); },
  "tbl": b => { ui.tables[b.dataset.id] = !ui.tables[b.dataset.id]; render(); },
  "setting": b => { S()[b.dataset.k] = b.dataset.num ? Number(b.dataset.v) : b.dataset.v; commit(); },
  "sched": b => { const i = b.dataset.i; const nx = { t:"o", o:"r", r:"t" }; S().sched[i] = nx[S().sched[i] || "r"]; commit(); },
  "export": () => downloadBlob(backupBlob(), backupName()),
  "share": async () => {
    const f = new File([backupBlob()], backupName(), { type:"application/json" });
    try{ if (navigator.canShare({ files:[f] })) await navigator.share({ files:[f], title:"Copia · Correctivo" }); else downloadBlob(f, f.name); }
    catch(e){ if (e.name !== "AbortError") downloadBlob(f, f.name); }
  },
  "import": () => $("#fileIn").click(),
  "csv": () => downloadBlob(new Blob(["﻿" + toCSV()], { type:"text/csv;charset=utf-8" }), `correctivo-${todayIso()}.csv`),
  "install": async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); },
  "wipe": () => { if (confirm("¿Borrar todos los registros de este móvil? No se puede deshacer.") && confirm("Última confirmación: se borra todo.")) { DB = fresh(); commit(); toast("Datos borrados"); } },
};
document.addEventListener("click", e => {
  const sm = e.target.closest && e.target.closest(".check .lbl small, .ex-p");
  if (sm && (sm.classList.contains("full") || sm.scrollHeight > sm.clientHeight + 2)){ sm.classList.toggle("full"); e.stopPropagation(); return; }
  const b = e.target.closest("[data-action]"); if (!b) return;
  const f = A[b.dataset.action]; if (f){ f(b, e); requestPersist(); }
});
document.addEventListener("input", e => {
  const t0 = e.target;
  if (t0.dataset && t0.dataset.cbind){ setp(K(), t0.dataset.cbind, t0.value || undefined); commit(); return; }
  if (t0.dataset && t0.dataset.sbind){
    let v = t0.value || undefined;
    if (v !== undefined && t0.dataset.num){ const n = Number(String(v).replace(",", ".")); v = isFinite(n) ? n : undefined; }
    const [k, sub] = t0.dataset.sbind.split(".");
    if (sub){ S()[k] = Object.assign({}, S()[k]); if (v === undefined) delete S()[k][sub]; else S()[k][sub] = v; }
    else { if (v === undefined) delete S()[k]; else S()[k] = v; }
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); return;
  }
  const t = e.target; if (!t.dataset || !t.dataset.bind) return;
  let v = t.value || undefined;
  if (v !== undefined && t.dataset.num){ const n = Number(String(v).replace(",", ".")); v = isFinite(n) ? n : undefined; }
  setp(wday(), t.dataset.bind, v);
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 400);
});
document.addEventListener("pointermove", e => { const c = e.target.closest && e.target.closest(".chart"); if (c) chartHover(c, e); });
document.addEventListener("pointerdown", e => { const c = e.target.closest && e.target.closest(".chart"); if (c) chartHover(c, e); });
document.addEventListener("pointerout", e => {
  const c = e.target.closest && e.target.closest(".chart");
  if (c && !c.contains(e.relatedTarget)){ const t = c.querySelector(".tip"); if (t) t.style.display = "none"; const x = c.querySelector(".xh"); if (x) x.setAttribute("visibility","hidden"); }
});

/* ---------------- Copias ---------------- */
const backupName = () => `correctivo-copia-${todayIso()}.json`;
const backupBlob = () => new Blob([JSON.stringify({ app:"correctivo", exported:new Date().toISOString(), ...DB }, null, 1)], { type:"application/json" });
function downloadBlob(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try{
    const d = JSON.parse(await f.text());
    if (!d || d.app !== "correctivo" || !d.days) throw new Error("formato");
    const n = Object.keys(d.days).length;
    if (!confirm(`La copia tiene ${n} días. Se combinará con lo que hay: si un día existe en los dos, gana el de la copia. ¿Seguir?`)) return;
    Object.assign(DB.days, d.days); if (d.settings) DB.settings = Object.assign(DB.settings, d.settings); if (d.cocina) DB.cocina = d.cocina;
    commit(); toast(`Importados ${n} días`);
  }catch(err){ toast("Ese archivo no es una copia válida de esta app"); }
});
function toCSV(){

    "hk_series","hk_reps","hk_reps_antes_ardor","hk_sonda_ok","pie_reps_antes_ardor","pie_costilla_abre","oh_bu_s","oh_lado_s","oh_otro_s","carry","carry_kg","carry_paseos","retest",
    "b_modo","fsq_kg","fsq_series","fsq_reps","swing_kg","swing_series","swing_reps","row_kg","row_series","row_reps","scarry_kg","scarry_series","scarry_paseos","airbike_tipo","airbike_intervalos","airbike_min","airbike_vatios","airbike_rpm","airbike_kcal","test_vatios_max","test_rpm_mas","creatina","suero","despertares","luz_antes_2330","cafe_antes_14","tomas_proteina","paseo_min","peso","cintura","b_kg_max","b_kg_rondas","b_rondas","b_rondas_completas","b_limpia_video","video","notas"];
  const q = v => v == null ? "" : /[",;\n]/.test(String(v)) ? `"${String(v).replace(/"/g,'""')}"` : String(v);
  const rows = Object.keys(DB.days).sort().map(x => { const d = DB.days[x], g = p => getp(d, p); return [x, d.sueno, d.energia, p3Done(d), g("p3.lateral") ? 1 : "", d.finDia, g("extra.flex.done") ? 1 : "", g("extra.frog.done") ? (g("extra.frog.resp") ?? "sí") : "",
    g("extra.pull.done") ? (g("extra.pull.reps") ?? "sí") : "", g("extra.pull.kg"), g("extra.bear.done") ? (g("extra.bear.var") ?? "sí") : "", g("extra.bear.secs"),
    g("extra.hollow.done") ? (g("extra.hollow.secs") ?? "sí") : "", g("extra.hollow.var"), g("extra.legr.done") ? (g("extra.legr.reps") ?? "sí") : "",
    g("extra.hang.done") ? (g("extra.hang.reps") ?? "sí") : "", g("extra.rot.izq"), g("extra.rot.der"), g("extra.bench.done") ? 1 : "", g("extra.ribgrab.done") ? 1 : "", g("extra.wall.done") ? 1 : "",
    g("a.bu.kg"), g("a.bu.series"), g("a.bu.reps"), g("a.arr.reps"), g("a.arr.sinBU") ? 1 : "", g("a.arr.cadera") ? 1 : "", g("a.contra.done") ? (g("a.contra.res") ?? "sí") : "", g("a.iso.done") ? 1 : "", g("extra.plank.done") ? (g("extra.plank.secs") ?? "sí") : "", g("a.tgu.kg"), g("a.tgu.izq"), g("a.tgu.der"),
    g("a.hk.series"), g("a.hk.reps"), g("a.hk.ardor"), g("a.hk.sondaOk") ? 1 : "", g("a.pie.ardor"), g("a.pie.abre") ? 1 : "",
    g("a.oh.bu"), g("a.oh.lado"), g("a.oh.otro"), g("a.carry.var"), g("a.carry.kg"), g("a.carry.paseos"), g("a.retest.done") ? 1 : "",
    hasB(d) ? bMode(d, x) : "", ...FZ.flatMap(e => getp(d, "b.f."+e.k+".done") ? [g("b.f."+e.k+".kg"), g("b.f."+e.k+".series"), g("b.f."+e.k+".reps")] : ["","",""]),
    airDone(d) ? (g("air.tipo") ?? "sí") : "", g("air.rondas"), g("air.min"), g("air.vatios"), g("air.rpm"), g("air.kcal"), g("air.testW"), g("air.testRPM"), g("sup.cre") ? 1 : "", g("sup.suero") ? 1 : "",
    d.despertares, g("hab.luz") ? 1 : "", g("hab.cafe") ? 1 : "", g("hab.prot"), g("paseo.done") ? (g("paseo.min") ?? "sí") : "", g("cuerpo.peso"), g("cuerpo.cintura"),
    maxBkg(d), roundKgs(d).join("/"), (g("b.rounds")||[]).length || "", roundsDone(d) || "", g("b.limpia") ? 1 : "", d.video ? 1 : "", d.notas].map(q).join(","); });
  return [cols.join(","), ...rows].join("\n");
}

/* ---------------- Utilidades ---------------- */
let toastT = null;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }
let persistAsked = false;
function requestPersist(){ if (persistAsked) return; persistAsked = true; try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (ui.tab === "ajustes") render(); });
window.addEventListener("storage", e => { if (e.key === KEY){ DB = load(); render(); } });
// Si la app queda abierta pasada la medianoche, "hoy" se actualiza al volver.
let lastToday = todayIso();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const t = todayIso(); if (t !== lastToday){ if (ui.date === lastToday) ui.date = t; lastToday = t; render(); }
});
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
render();
