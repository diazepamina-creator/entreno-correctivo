name: APK de Android

on:
  push:
    branches: [main]
    paths: ["index.html", "manifest.webmanifest", "*.png", "apk/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versión de la app
        id: v
        run: echo "version=$(grep -oP 'const VERSION = "\K[0-9.]+' index.html)" >> "$GITHUB_OUTPUT"

      - name: Preparar el proyecto
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npm run www
          npx cap sync android

      - name: Compilar
        working-directory: apk/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.v.outputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/correctivo-${{ steps.v.outputs.version }}.apk"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Correctivo ${{ steps.v.outputs.version }}
          make_latest: true
          files: correctivo-${{ steps.v.outputs.version }}.apk
          body: |
            Descarga el archivo `.apk` desde el móvil e instálalo encima de la versión anterior: los datos se mantienen.
            La primera vez, Android pedirá permiso para instalar apps de esta fuente.
